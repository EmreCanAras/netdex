services:
  postgres:
    image: postgres:16-alpine
    container_name: netdex_db
    environment:
      POSTGRES_DB: netdex
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: p123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d

volumes:
  postgres_data: